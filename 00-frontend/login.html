<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سفر سرویس | ورود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            accent: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a' },
          },
          fontFamily: { sans: ['"Vazirmatn"', 'Tahoma', 'sans-serif'] },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .input-field { transition: all 0.3s ease; }
    .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
    .btn-primary { transition: all 0.3s ease; background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #22c55e); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 8px 32px rgba(59,130,246,0.3); }
    .divider { display: flex; align-items: center; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .divider::before { margin-left: 1rem; }
    .divider::after { margin-right: 1rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.6s ease-out forwards; }
    .animate-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .animate-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .animate-in-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .animate-in-delay-4 { animation-delay: 0.4s; opacity: 0; }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="w-full max-w-md animate-in">
    <!-- Main Card -->
    <div class="glass rounded-3xl p-8 md:p-10 shadow-2xl">
      <!-- Logo -->
      <div class="text-center mb-8 animate-in animate-in-delay-1">
        <div class="logo-icon">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">سفر سرویس</h1>
        <p class="text-gray-400 text-sm mt-1">سوپر اپلیکیشن هوشمند حمل و نقل و خدمات</p>
      </div>

      <!-- Login Form -->
      <form class="space-y-5" onsubmit="handleLogin(event)">
        <div class="animate-in animate-in-delay-2">
          <label class="block text-gray-300 text-sm font-medium mb-2">شماره موبایل</label>
          <div class="relative">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
              </svg>
            </span>
            <input type="tel" id="phone" dir="ltr" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required
              class="input-field w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pr-12 pl-4 text-white placeholder-gray-500 outline-none text-sm" />
          </div>
        </div>

        <div class="animate-in animate-in-delay-3">
          <label class="block text-gray-300 text-sm font-medium mb-2">رمز عبور</label>
          <div class="relative">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input type="password" id="password" placeholder="••••••••" required
              class="input-field w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pr-12 pl-4 text-white placeholder-gray-500 outline-none text-sm" />
          </div>
        </div>

        <div class="flex items-center justify-between text-sm animate-in animate-in-delay-3">
          <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-white/10 bg-white/5 accent-blue-500" />
            <span>مرا به خاطر بسپار</span>
          </label>
          <a href="#" class="text-blue-400 hover:text-blue-300 transition">فراموشی رمز عبور؟</a>
        </div>

        <button type="submit" class="btn-primary w-full text-white font-semibold py-3.5 rounded-xl text-sm animate-in animate-in-delay-4">
          ورود به سفر سرویس
        </button>
      </form>

      <!-- Divider -->
      <div class="divider my-6 animate-in animate-in-delay-4">
        <span>یا</span>
      </div>

      <!-- Register Link -->
      <p class="text-center text-gray-400 text-sm animate-in animate-in-delay-4">
        حساب کاربری ندارید؟
        <a href="#" class="text-blue-400 hover:text-blue-300 font-medium transition">ثبت نام</a>
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-600 text-xs mt-6 animate-in animate-in-delay-4">
      با ورود به سفر سرویس، <a href="#" class="text-gray-500 hover:text-gray-400 underline">قوانین و شرایط</a> را می‌پذیرید.
    </p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-red-500/90 backdrop-blur-lg text-white px-6 py-3 rounded-xl shadow-2xl text-sm font-medium transition-all duration-500 opacity-0 translate-y-[-20px] pointer-events-none z-50">
    ⚠️ <span id="toast-message">خطا</span>
  </div>

  <script>
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      msg.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 3000);
    }

    function handleLogin(event) {
      event.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!phone) { showToast('لطفاً شماره موبایل خود را وارد کنید'); return; }
      if (phone.length < 10) { showToast('شماره موبایل معتبر نیست'); return; }
      if (!password) { showToast('لطفاً رمز عبور خود را وارد کنید'); return; }
      if (password.length < 4) { showToast('رمز عبور باید حداقل ۴ کاراکتر باشد'); return; }

      showToast('در حال ورود به سفر سرویس...');
      // Simulate login - will connect to backend in Phase 2
      setTimeout(() => {
        showToast('✅ ورود موفقیت‌آمیز (درگاه API در فاز بعدی فعال می‌شود)');
      }, 1500);
    }
  </script>
</body>
</html>
