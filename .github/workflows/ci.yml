name: Trip Management CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 16-mobility-engine/package-lock.json

      - name: Generate ephemeral RS256 test keys
        run: node 00-infrastructure/keys/generate-keys.js

      - name: Install dependencies
        run: |
          cd 16-mobility-engine
          npm ci

      - name: Run tests
        run: |
          cd 16-mobility-engine
          npm test
