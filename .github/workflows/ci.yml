name: Trip Management CI

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 16-mobility-engine/package-lock.json

      - name: Install dependencies
        run: |
          cd 16-mobility-engine
          npm ci

      - name: Run tests
        run: |
          cd 16-mobility-engine
          npm test

  wallet-service-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run wallet escrow and payment regression tests
        run: npx jest --runInBand --runTestsByPath 05-wallet-service/__tests__/trip-completed-handler.test.js --testTimeout=30000
