name: Trip Management CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 16-mobility-engine/package-lock.json

      - name: Install dependencies
        run: |
          cd 16-mobility-engine
          npm ci

      - name: Run tests
        run: |
          cd 16-mobility-engine
          npm test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: client-web
        run: npm ci

      - name: Build web client
        working-directory: client-web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
