name: Trip Management CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 12-trip-management/package-lock.json

      - name: Install dependencies
        run: |
          cd 12-trip-management
          npm ci

      - name: Run tests
        run: |
          cd 12-trip-management
          npm test
