name: Backend CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start Test Database (Isolated in Cloud)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Install root dependencies
        run: npm ci

      - name: Verify critical proxy-addr advisory is remediated
        run: |
          node -e "const p = require('./node_modules/proxy-addr/package.json'); if (p.version !== '2.0.8') { console.error('Expected proxy-addr 2.0.8, found ' + p.version); process.exit(1); } console.log('proxy-addr ' + p.version + ' installed');"
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.error || !report.metadata || !report.metadata.vulnerabilities) {
            console.error('npm audit did not return a complete vulnerability report:', JSON.stringify(report.error || report));
            process.exit(1);
          }
          const proxyAddr = report.vulnerabilities && report.vulnerabilities['proxy-addr'];
          if (proxyAddr) {
            console.error('npm audit still reports proxy-addr:', JSON.stringify(proxyAddr));
            process.exit(1);
          }
          const counts = report.metadata.vulnerabilities;
          if (Number(counts.critical || 0) > 0) {
            console.error('Critical npm audit findings remain:', counts.critical);
            process.exit(1);
          }
          console.log('npm audit returned a complete report with no proxy-addr advisory and no remaining critical findings.');
          NODE

      - name: Report root dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          console.log(`Root dependency audit: ${Object.keys(vulnerabilities).length} vulnerable packages`);
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || [])
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => entry.title || entry.name || 'Advisory');
            console.log([
              String(item.severity || 'unknown').toUpperCase(),
              name,
              `direct=${Boolean(item.isDirect)}`,
              `range=${item.range || 'unknown'}`,
              `fixAvailable=${JSON.stringify(item.fixAvailable ?? null)}`,
              `advisories=${advisories.join('; ') || 'see npm audit JSON'}`,
            ].join(' | '));
          }
          NODE

      - name: Check wallet source and regression-test syntax
        run: |
          node --check 05-wallet-service/models/wallet.model.js
          node --check 05-wallet-service/models/transaction.model.js
          node --check 05-wallet-service/models/escrow.model.js
          node --check 05-wallet-service/services/wallet.service.js
          node --check 05-wallet-service/__tests__/trip-completed-handler.test.js
          node --check 05-wallet-service/__tests__/wallet-model-currency.test.js
          node --check 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Generate ephemeral RS256 test keys
        env:
          NODE_ENV: test
        run: node 00-infrastructure/keys/generate-keys.js

      - name: Run PostgreSQL migrations
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Verify PostgreSQL migration repeatability
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Verify checksum drift fails closed on PostgreSQL
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5433/safar_test_db
          NODE_ENV: test
        run: |
          set -euo pipefail
          migration_file="00-infrastructure/database/migrations/001_initial_global_schema.sql"
          expected_checksum="$(sha256sum "$migration_file" | awk '{print $1}')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.schema_migrations SET checksum = repeat('0', 64) WHERE migration_id = '001_initial_global_schema.sql'"
          set +e
          output="$(node 00-infrastructure/database/migrations/run-all-migrations.js 2>&1)"
          status=$?
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.schema_migrations SET checksum = '$expected_checksum' WHERE migration_id = '001_initial_global_schema.sql'"
          if [ "$status" -eq 0 ]; then
            echo "Expected migration runner to reject checksum drift, but it succeeded."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'MIGRATION_CHECKSUM_MISMATCH'; then
            printf '%s\n' "$output"
            echo "Runner failed for a reason other than checksum drift."
            exit 1
          fi
          echo "Checksum drift was rejected and the test ledger checksum was restored."

      - name: Install dependencies & run RBAC tests
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@localhost:5433/safar_test_db
          NODE_ENV: test
        run: |
          cd 17-rbac-service
          npm install
          npm test
      - name: Run trip creation authorization regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 16-mobility-engine/tests/trip-router-auth.test.js

      - name: Run wallet trip-settlement regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/trip-completed-handler.test.js 05-wallet-service/__tests__/wallet-model-currency.test.js

      - name: Run migration atomicity regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 00-infrastructure/database/migrations/__tests__/run-all-migrations.test.js

      - name: Check migration runner syntax
        run: node --check 00-infrastructure/database/migrations/run-all-migrations.js

