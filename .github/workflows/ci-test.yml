name: Backend CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start Test Database (Isolated in Cloud)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Install root dependencies
        run: npm ci

      - name: Run taxi fare confirmation regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath client-web/src/services/taxiService.test.js

      - name: Run JWT key generation safety tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 00-infrastructure/keys/__tests__/generate-keys.test.js

      - name: Verify critical proxy-addr advisory is remediated
        run: |
          node -e "const p = require('./node_modules/proxy-addr/package.json'); if (p.version !== '2.0.8') { console.error('Expected proxy-addr 2.0.8, found ' + p.version); process.exit(1); } console.log('proxy-addr ' + p.version + ' installed');"
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.error('npm audit produced invalid JSON; refusing to pass the security gate.');
            process.exit(1);
          }
          if (!report || typeof report !== 'object' || Array.isArray(report) || report.error) {
            console.error('npm audit report is missing or contains an error; refusing to pass.');
            process.exit(1);
          }
          if (!report.metadata || !report.metadata.vulnerabilities ||
              typeof report.metadata.vulnerabilities !== 'object' ||
              Array.isArray(report.metadata.vulnerabilities)) {
            console.error('npm audit report has no valid vulnerability summary; refusing to pass.');
            process.exit(1);
          }
          if (!report.vulnerabilities || typeof report.vulnerabilities !== 'object' ||
              Array.isArray(report.vulnerabilities)) {
            console.error('npm audit report has no valid vulnerability details; refusing to pass.');
            process.exit(1);
          }
          const counts = report.metadata.vulnerabilities;
          for (const level of ['info', 'low', 'moderate', 'high', 'critical']) {
            if (!Number.isSafeInteger(counts[level]) || counts[level] < 0) {
              console.error('npm audit report has an invalid vulnerability count for ' + level + '.');
              process.exit(1);
            }
          }
          const proxyAddr = report.vulnerabilities['proxy-addr'];
          if (proxyAddr) {
            console.error('npm audit still reports proxy-addr:', JSON.stringify(proxyAddr));
            process.exit(1);
          }
          if (counts.critical > 0) {
            console.error('Critical npm audit findings remain:', counts.critical);
            process.exit(1);
          }
          console.log('npm audit summary:', JSON.stringify(counts));
          console.log('No proxy-addr advisory or critical findings remain; high/moderate findings are reported for remediation.');
          NODE

      - name: Report root dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.error('npm audit report step received invalid JSON; refusing to report incomplete results.');
            process.exit(1);
          }
          if (!report || typeof report !== 'object' || Array.isArray(report) || report.error ||
              !report.metadata || !report.metadata.vulnerabilities ||
              typeof report.vulnerabilities !== 'object' || !report.vulnerabilities ||
              Array.isArray(report.vulnerabilities)) {
            console.error('npm audit report step received an incomplete report; refusing to report incomplete results.');
            process.exit(1);
          }
          const vulnerabilities = report.vulnerabilities;
          console.log(`Root dependency audit: ${Object.keys(vulnerabilities).length} vulnerable packages`);
          for (const [name, item] of Object.entries(vulnerabilities)) {
            if (!item || typeof item !== 'object' || Array.isArray(item)) {
              console.error('npm audit report contains an invalid package entry; refusing to report incomplete results.');
              process.exit(1);
            }
            const advisories = (Array.isArray(item.via) ? item.via : [])
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => entry.title || entry.name || 'Advisory');
            console.log([
              String(item.severity || 'unknown').toUpperCase(),
              name,
              `direct=${Boolean(item.isDirect)}`,
              `range=${item.range || 'unknown'}`,
              `fixAvailable=${JSON.stringify(item.fixAvailable ?? null)}`,
              `advisories=${advisories.join('; ') || 'see npm audit JSON'}`,
            ].join(' | '));
          }
          NODE

      - name: Check wallet source and regression-test syntax
        run: |
          node --check 05-wallet-service/models/wallet.model.js
          node --check 05-wallet-service/models/transaction.model.js
          node --check 05-wallet-service/models/escrow.model.js
          node --check 05-wallet-service/services/wallet.service.js
          node --check 05-wallet-service/__tests__/trip-completed-handler.test.js
          node --check 05-wallet-service/__tests__/wallet-model-currency.test.js
          node --check 00-infrastructure/database/migrations/run-all-migrations.js
          node --check 00-infrastructure/database/migrations/__tests__/run-all-migrations.integration.test.js

      - name: Generate ephemeral RS256 test keys
        env:
          NODE_ENV: test
        run: node 00-infrastructure/keys/generate-keys.js

      - name: Run authentication phone normalization regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 13-auth-management/tests/user-phone-validation.test.js 13-auth-management/tests/phone-number-normalization.test.js

      - name: Run PostgreSQL migrations
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js
      

      - name: Run authentication end-to-end regression tests
        env:
          NODE_ENV: test
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5433/safar_test_db
        run: npm test -- --runTestsByPath 13-auth-management/tests/integration/AuthIntegration.test.js

      - name: Verify wallet reconciliation snapshot returns numeric monetary values
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const client = new Client({
            host: process.env.PG_HOST,
            port: Number(process.env.PG_PORT),
            database: process.env.PG_DATABASE,
            user: process.env.PG_USER,
            password: process.env.PG_PASSWORD,
          });
          (async () => {
            await client.connect();
            try {
              const result = await client.query(
                "SELECT pg_get_function_result('fn_get_wallet_snapshot(uuid)'::regprocedure) AS signature"
              );
              const signature = result.rows[0] && result.rows[0].signature;
              const numericColumns = (String(signature).match(/\bnumeric\b/g) || []).length;
              if (!signature || numericColumns !== 6 || /\bbigint\b/i.test(signature)) {
                throw new Error('Wallet snapshot must expose six NUMERIC monetary fields; got: ' + signature);
              }
              console.log('Wallet reconciliation snapshot preserves NUMERIC monetary precision:', signature);
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify PostgreSQL migration repeatability
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Verify PostgreSQL migration rollback and ledger atomicity
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          MIGRATION_INTEGRATION_TESTS: '1'
          NODE_ENV: test
        run: npm test -- --runTestsByPath 00-infrastructure/database/migrations/__tests__/run-all-migrations.integration.test.js



      - name: Verify checksum drift fails closed on PostgreSQL
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5433/safar_test_db
          NODE_ENV: test
        run: |
          set -euo pipefail
          migration_file="00-infrastructure/database/migrations/001_initial_global_schema.sql"
          expected_checksum="$(sha256sum "$migration_file" | awk '{print $1}')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.schema_migrations SET checksum = repeat('0', 64) WHERE migration_id = '001_initial_global_schema.sql'"
          set +e
          output="$(node 00-infrastructure/database/migrations/run-all-migrations.js 2>&1)"
          status=$?
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.schema_migrations SET checksum = '$expected_checksum' WHERE migration_id = '001_initial_global_schema.sql'"
          if [ "$status" -eq 0 ]; then
            echo "Expected migration runner to reject checksum drift, but it succeeded."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'MIGRATION_CHECKSUM_MISMATCH'; then
            printf '%s\n' "$output"
            echo "Runner failed for a reason other than checksum drift."
            exit 1
          fi
          echo "Checksum drift was rejected and the test ledger checksum was restored."

      - name: Install dependencies & run RBAC tests
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@localhost:5433/safar_test_db
          NODE_ENV: test
        run: |
          cd 17-rbac-service
          npm install
          npm test
      - name: Run trip creation authorization regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 16-mobility-engine/tests/trip-router-auth.test.js

      - name: Run IAM login fail-closed regression test
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 24-iam-service/__tests__/auth.routes.test.js

      - name: Run wallet transaction-ledger verification regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/reconciliation.verify-transaction.test.js

      - name: Run wallet reconciliation decimal precision regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/reconciliation.decimal-precision.test.js

      - name: Run wallet trip-settlement regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/trip-completed-handler.test.js 05-wallet-service/__tests__/wallet-model-currency.test.js

      - name: Run wallet escrow release controller security tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/wallet.controller.escrow.test.js

      - name: Run wallet transfer idempotency regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/wallet.service.transfer-idempotency.test.js 05-wallet-service/__tests__/wallet.controller.transfer-idempotency.test.js
      - name: Run wallet external-reference idempotency regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/wallet.service.reference-idempotency.test.js

      - name: Check wallet transfer idempotency test syntax
        run: |
          node --check 05-wallet-service/__tests__/wallet.service.transfer-idempotency.test.js
          node --check 05-wallet-service/__tests__/wallet.controller.transfer-idempotency.test.js

      - name: Run promo validation lock-safety regression tests
        env:
          NODE_ENV: test
        run: |
          node --check 23-promo-service/application/ValidatePromoUseCase.js
          node --check 23-promo-service/tests/ValidatePromoUseCase.test.js
          node 23-promo-service/tests/ValidatePromoUseCase.test.js

