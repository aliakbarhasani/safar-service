name: Backend CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Start Test Database (Isolated in Cloud)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Generate ephemeral RS256 test keys
        run: node 00-infrastructure/keys/generate-keys.js

      - name: Install root dependencies for migration runner
        run: npm ci

      - name: Run test database migrations
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Install Dependencies & Run Tests (RBAC Module)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5433/safar_test_db
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: |
          cd 17-rbac-service
          npm install
          npm test