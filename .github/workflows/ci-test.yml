name: Backend CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Start Test Database (Isolated in Cloud)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Install Dependencies & Run Tests (RBAC Module)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5433/safar_test_db
          NODE_ENV: test
        run: |
          cd 17-rbac-service
          npm install
          npm test