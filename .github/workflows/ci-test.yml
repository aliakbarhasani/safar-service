name: Backend CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start Test Database (Isolated in Cloud)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Install root dependencies
        run: npm ci

      - name: Check wallet source and regression-test syntax
        run: |
          node --check 05-wallet-service/models/wallet.model.js
          node --check 05-wallet-service/models/transaction.model.js
          node --check 05-wallet-service/models/escrow.model.js
          node --check 05-wallet-service/services/wallet.service.js
          node --check 05-wallet-service/__tests__/trip-completed-handler.test.js
          node --check 05-wallet-service/__tests__/wallet-model-currency.test.js
          node --check 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Generate ephemeral RS256 test keys
        env:
          NODE_ENV: test
        run: node 00-infrastructure/keys/generate-keys.js

      - name: Run PostgreSQL migrations
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          NODE_ENV: test
        run: node 00-infrastructure/database/migrations/run-all-migrations.js

      - name: Install dependencies & run RBAC tests
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
          PG_DATABASE: safar_test_db
          PG_USER: test_user
          PG_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@localhost:5433/safar_test_db
          NODE_ENV: test
        run: |
          cd 17-rbac-service
          npm install
          npm test
      - name: Run trip creation authorization regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 16-mobility-engine/tests/trip-router-auth.test.js

      - name: Run wallet trip-settlement regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 05-wallet-service/__tests__/trip-completed-handler.test.js 05-wallet-service/__tests__/wallet-model-currency.test.js

      - name: Run pricing, discounted quote, and promo idempotency regression tests
        env:
          NODE_ENV: test
        run: npm test -- --runTestsByPath 18-pricing-service/tests/CalculateFareUseCase.test.js 16-mobility-engine/tests/CreateTripUseCase.quote-guard.test.js 16-mobility-engine/tests/EndTripUseCase.test.js 23-promo-service/tests/TripCompleted.handler.test.js

      - name: Check changed pricing and promo source syntax
        run: |
          node --check 18-pricing-service/application/CalculateFareUseCase.js
          node --check 15-pricing-engine/infrastructure/PricingRepository.js
          node --check 16-mobility-engine/application/CreateTripUseCase.js
          node --check 16-mobility-engine/infrastructure/TripRepository.js
          node --check 16-mobility-engine/application/EndTripUseCase.js
          node --check 23-promo-service/handlers/TripCompleted.handler.js
          node --check 18-pricing-service/tests/CalculateFareUseCase.test.js
          node --check 23-promo-service/tests/TripCompleted.handler.test.js

